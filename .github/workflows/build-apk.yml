name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VERSION_RAW=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VERSION_RAW" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          JAVA_MAJOR=$(echo "$JAVA_VERSION_RAW" | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version is $JAVA_MAJOR, which is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore not found. Creating temporary debug keystore..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be verified after creation step."
            exit 1
          fi
          echo "Temporary debug keystore created and verified."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK."
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file $EXPECTED_APK is empty."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "Error: File $EXPECTED_APK does not have .apk extension."
            exit 1
          fi
          echo "Confirmed: $EXPECTED_APK exists, is a regular file, is not empty, and has .apk extension."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${{ runner.temp }}/release_asset_staging"
          mkdir -p "$ASSET_DIR"
          REPO_RAW="${{ github.event.repository.name }}"
          if [ -z "$REPO_RAW" ]; then
            REPO_RAW="app"
          fi
          REPO_CLEAN=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          ASSET_FILENAME="${REPO_CLEAN}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty at $ASSET_PATH"
            exit 1
          fi
          echo "Prepared APK release asset at $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ] || [[ "$RELEASE_ASSET" != *.apk ]]; then
            echo "Error: Release asset validation failed: $RELEASE_ASSET"
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES=$(cat <<'EOF'
          ### Debug APK Build
          This is an automatically generated debug APK.
          - Built by: GitHub Actions
          - Run number: ${{ github.run_number }}
          - Run attempt: ${{ github.run_attempt }}
          - Source commit SHA: ${{ github.sha }}

          > [!NOTE]
          > The APK is intended for testing.
          > The APK is not a Play Store production release.
          > The APK is signed only with a temporary debug keystore.
          EOF
          )
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "================================================="
            echo " GitHub Release Published Successfully!"
            echo "================================================="
            gh release view "$RELEASE_TAG" || true
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"
            
            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Release Page:** [View GitHub Release]($RELEASE_URL)"
              echo "- **Direct APK Asset:** \`$ASSET_FILENAME\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section of the [GitHub Release]($RELEASE_URL) on your device."
              echo ""
              echo "> **Backup:** The standard GitHub Actions artifact \`app-debug-apk\` is also available for this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "APK build succeeded and the artifact named 'app-debug-apk' remains available."
            
            {
              echo "### ⚠️ Debug APK Built (Release Publishing Notice)"
              echo ""
              echo "The debug APK was built successfully, but GitHub Release creation failed or was skipped."
              echo ""
              echo "**Backup Download:** The GitHub Actions artifact named \`app-debug-apk\` is available and can be downloaded from the Summary page of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
